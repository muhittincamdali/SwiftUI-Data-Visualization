# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# Only 2xx counts as a working link. A 403 or 429 can just as well come from a removed page or a
# host that turns the checker away, so accepting them would hide broken links. Rate limits are
# met by the retries and the daily cache; a site that always refuses automated requests belongs
# in `exclude` below, with the reason.
accept = ["200..=299"]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
]

# The READMEs link to this repository's own files on master (graphics in .github/brand, screenshots
# in docs/images, Package.swift, LICENSE, folders). A pull request cannot change master, so the
# checked-out files stand in for them: on master they are the same files, on a pull request they are
# the ones it adds or removes. The path is the workspace of GitHub-hosted runners; a local run
# passes the same --remap options with its own path.
remap = [
  '^https://raw\.githubusercontent\.com/muhittincamdali/SwiftUI-Data-Visualization/master/(.*)$ file:///home/runner/work/SwiftUI-Data-Visualization/SwiftUI-Data-Visualization/$1',
  '^https://github\.com/muhittincamdali/SwiftUI-Data-Visualization/(?:blob|tree)/master/(.*)$ file:///home/runner/work/SwiftUI-Data-Visualization/SwiftUI-Data-Visualization/$1',
  # The article pages on GitHub Pages are built from the .docc articles by docs.yml after a push
  # to master, so a pull request that adds an article links to a page that is not online yet. Each
  # article URL is checked against its source file instead; the documentation root stays a live
  # check, so a site that is down still fails.
  '^https://muhittincamdali\.github\.io/SwiftUI-Data-Visualization/documentation/swiftuidatavisualization/gettingstarted$ file:///home/runner/work/SwiftUI-Data-Visualization/SwiftUI-Data-Visualization/Sources/SwiftUIDataVisualization/SwiftUIDataVisualization.docc/GettingStarted.md',
  '^https://muhittincamdali\.github\.io/SwiftUI-Data-Visualization/documentation/swiftuidatavisualization/choosingachart$ file:///home/runner/work/SwiftUI-Data-Visualization/SwiftUI-Data-Visualization/Sources/SwiftUIDataVisualization/SwiftUIDataVisualization.docc/ChoosingAChart.md',
  '^https://muhittincamdali\.github\.io/SwiftUI-Data-Visualization/documentation/swiftuidatavisualization/largeandlivedata$ file:///home/runner/work/SwiftUI-Data-Visualization/SwiftUI-Data-Visualization/Sources/SwiftUIDataVisualization/SwiftUIDataVisualization.docc/LargeAndLiveData.md',
  '^https://muhittincamdali\.github\.io/SwiftUI-Data-Visualization/documentation/swiftuidatavisualization/accessiblecharts$ file:///home/runner/work/SwiftUI-Data-Visualization/SwiftUI-Data-Visualization/Sources/SwiftUIDataVisualization/SwiftUIDataVisualization.docc/AccessibleCharts.md',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
]
